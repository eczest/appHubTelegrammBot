[project]
name = "telegram-store-bot"
version = "0.1.0"
description = "Telegram bot storefront for an electronics shop"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31,<4.0",
    "python-dotenv>=1.0,<2.0",
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
